name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Asset names keep the target triples used by install.sh and the docs.
        include:
          - target: x86_64-unknown-linux-musl
            goos: linux
            goarch: amd64
          - target: aarch64-unknown-linux-musl
            goos: linux
            goarch: arm64
          - target: x86_64-apple-darwin
            goos: darwin
            goarch: amd64
          - target: aarch64-apple-darwin
            goos: darwin
            goarch: arm64
          - target: x86_64-pc-windows-msvc
            goos: windows
            goarch: amd64
          - target: aarch64-pc-windows-msvc
            goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name=zsync-${{ github.ref_name }}-${{ matrix.target }}
          exe=zsync
          [ "$GOOS" = windows ] && exe=zsync.exe
          mkdir "$name"
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o "$name/$exe" .
          cp README.md "$name/"
          if [ "$GOOS" = windows ]; then
            zip -r "$name.zip" "$name"
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
