[package]
name = "zsync"
version = "0.2.0"
edition = "2024"
description = "Sync local and remote folder pairs (Google Drive, OneDrive, etc.) using rclone"
repository = "https://github.com/renatormc/zsync"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[profile.release]
lto = true
strip = true
codegen-units = 1
